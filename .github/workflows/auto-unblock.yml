name: Auto Move Blocked to Todo

on:
  issues:
    types: [closed, reopened]

jobs:
  unblock-tasks:
    runs-on: ubuntu-latest
    steps:
      - name: Process Dependent Issues
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const closedIssueNumber = context.payload.issue.number;
            const isClosed = context.payload.action === 'closed';

            console.log(`Triggered by Issue #${closedIssueNumber} (${context.payload.action})`);

            // 1. 全 Issue を取得
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'all'
            });

            for (const issue of issues) {
              if (issue.number === closedIssueNumber || !issue.body) continue;

              // 本文から #数字 の参照を抽出
              const matches = issue.body.match(/#(\d+)/g);
              if (!matches) continue;

              const referencedNumbers = matches.map(m => parseInt(m.replace('#', '')));
              if (!referencedNumbers.includes(closedIssueNumber)) continue;

              console.log(`Target Dependent Issue Found: #${issue.number}`);

              // 依存先がすべて Closed か確認
              let allParentsClosed = true;
              for (const parentNum of referencedNumbers) {
                const parentIssue = issues.find(i => i.number === parentNum);
                if (parentIssue && parentIssue.state !== 'closed') {
                  allParentsClosed = false;
                  break;
                }
              }

              // 2. Node ID 経由で ProjectV2Item を強力に取得する GraphQL
              const query = `
                query($issueNodeId: ID!) {
                  node(id: $issueNodeId) {
                    ... on Issue {
                      projectItems(first: 10) {
                        nodes {
                          id
                          project {
                            id
                            fields(first: 20) {
                              nodes {
                                ... on ProjectV2SingleSelectField {
                                  id
                                  name
                                  options { id name }
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              `;

              const res = await github.graphql(query, { issueNodeId: issue.node_id });
              const projectItems = res.node?.projectItems?.nodes || [];

              if (projectItems.length === 0) {
                console.log(`⚠️ Issue #${issue.number} is not linked to any Project Item.`);
                continue;
              }

              for (const item of projectItems) {
                const statusField = item.project.fields.nodes.find(f => f.name === 'Status');
                if (!statusField) continue;

                const targetStatus = (isClosed && allParentsClosed) ? 'Todo' : 'Blocked';
                const targetOption = statusField.options.find(o => o.name.toLowerCase() === targetStatus.toLowerCase());

                if (targetOption) {
                  const mutation = `
                    mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                      updateProjectV2ItemFieldValue(
                        input: {
                          projectId: $projectId
                          itemId: $itemId
                          fieldId: $fieldId
                          value: { singleSelectOptionId: $optionId }
                        }
                      ) {
                        projectV2Item { id }
                      }
                    }
                  `;

                  await github.graphql(mutation, {
                    projectId: item.project.id,
                    itemId: item.id,
                    fieldId: statusField.id,
                    optionId: targetOption.id
                  });

                  console.log(`✅ SUCCESS: Moved Issue #${issue.number} to '${targetStatus}'`);
                } else {
                  console.log(`❌ Target Status Option '${targetStatus}' not found in Project.`);
                }
              }
            }
